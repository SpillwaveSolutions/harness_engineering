[project]
name = "harness-book-chapter14"
version = "0.1.0"
description = "Code listings + tests for Chapter 14 — Evaluator-optimizer loops, LLM-as-judge, and promotion gates."
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.28.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "playwright>=1.40.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"

[tool.uv]
package = false
