[project]
name = "chapter09"
version = "0.1.0"
description = "Listings for Chapter 9 — tools, skills, and a capability registry."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
    "anthropic>=0.50",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"

[tool.uv]
package = false
