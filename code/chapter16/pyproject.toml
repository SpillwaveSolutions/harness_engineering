[project]
name = "harness-book-chapter16"
version = "0.1.0"
description = "Code listings + tests for Chapter 16 — Hardening the harness: prompt injection, supply chain, and data exfiltration."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
    "opentelemetry-api>=1.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"

[tool.uv]
package = false
