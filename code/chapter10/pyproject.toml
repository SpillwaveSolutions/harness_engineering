[project]
name = "chapter10"
version = "0.1.0"
description = "Listings for Chapter 10 — Sandboxes and isolation."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "modal>=1.0",
    "deepagents>=0.7",
    "langchain-anthropic>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
asyncio_mode = "auto"

[tool.uv]
package = false
