[project]
name = "chapter12"
version = "0.1.0"
description = "Listings for Chapter 12 — Multi-agent coordination with the Agent2Agent (A2A) protocol."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.11",
    "a2a-sdk[fastapi]>=1.3,<2",
    "fastapi>=0.115",
    "aiokafka>=0.11",
    "google-adk>=2.14,<3",
    "anthropic>=0.40",
    "mcp>=1.10,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
asyncio_mode = "auto"

[tool.uv]
package = false
