[project]
name = "chapter08"
version = "0.1.0"
description = "Listings for Chapter 8 — plan-step validators and tool-call hooks."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
    "claude-agent-sdk>=0.2",
    "langchain>=1.0",
    "deepagents>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"

[tool.uv]
package = false
