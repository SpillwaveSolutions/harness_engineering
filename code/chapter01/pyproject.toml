[project]
name = "harness-book-chapter01"
version = "0.1.0"
description = "Code listings + tests for Chapter 1 — Why your agent fails in production."
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"

[tool.uv]
package = false
