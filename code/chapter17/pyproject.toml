[project]
name = "harness-book-chapter17"
version = "0.1.0"
description = "Code listings + tests for Chapter 17 — Choosing your harness: which patterns you need, and how to get them."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "claude-agent-sdk>=0.2.0",
    "deepagents>=0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"

[tool.uv]
package = false
