[project]
name = "chapter03"
version = "0.1.0"
description = "Listings for Chapter 3 — Harness and workflow patterns."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2",
    "langgraph>=0.2",
    "typing_extensions>=4.12",
    "strands-agents>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"

[tool.uv]
package = false
