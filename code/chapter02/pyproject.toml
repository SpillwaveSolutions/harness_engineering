[project]
name = "chapter02"
version = "0.1.0"
description = "Listings for Chapter 2 — From naked LLM to harnessed agent."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "anthropic>=0.116.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"

[tool.uv]
package = false
